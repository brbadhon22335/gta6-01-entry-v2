<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Neon Bay: Street Kings — Make GTA 6</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #0b0b18;
        overflow: hidden;
        height: 100%;
      }
      #game {
        display: block;
        width: 100vw;
        height: 100vh;
        touch-action: none;
      }
      #status {
        position: absolute;
        left: -9999px;
        width: 1px;
        height: 1px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="1280" height="800"></canvas>
    <p id="status" aria-live="polite">Neon Bay: Street Kings. Press Space or click to start.</p>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
